name: Build and test
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: dotnet build BattleNusantara.slnx -c Release
      - run: dotnet test tests/BattleNusantara.Tests -c Release --no-build
      - run: npx playwright install msedge
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/
  # The macOS and Linux desktop host (Photino) on real runners: build, start it, and require the page and the game's
  # scripts to answer within the smoke time. The LAN server is published for the same runtime.
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0 libnotify4 xvfb
      - run: dotnet publish src/BattleNusantara.Photino -c Release -r ${{ matrix.rid }} --self-contained true -o out/game
      - run: dotnet publish src/BattleNusantara.Server -c Release -r ${{ matrix.rid }} --self-contained true -o out/server
      - name: Smoke (Linux, virtual display)
        if: runner.os == 'Linux'
        working-directory: out/game
        env:
          NUSANTARA_SMOKE_SECONDS: '40'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: xvfb-run -a ./BattleNusantara
      - name: Smoke (macOS)
        if: runner.os == 'macOS'
        working-directory: out/game
        env:
          NUSANTARA_SMOKE_SECONDS: '40'
        run: ./BattleNusantara
      - name: Server answers /health
        working-directory: out/server
        run: |
          ./BattleNusantara.Server --urls http://127.0.0.1:5080 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5080/health && exit 0; sleep 2; done; exit 1
